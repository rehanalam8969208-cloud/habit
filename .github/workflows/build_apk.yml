name: Build Android APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Generate Android Code
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.rehan.habit

      - name: Inject Custom Habit Logo Vector
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#10B981"
                  android:pathData="M54,18 A36,36 0 1,0 90,54 A36,36 0 0,0 54,18 Z M54,78 A24,24 0 1,1 78,54 A24,24 0 0,1 54,78 Z M54,42 A12,12 0 1,0 66,54 A12,12 0 0,0 54,42 Z"/>
              <path
                  android:fillColor="#3B82F6"
                  android:pathData="M50,10 L58,10 L58,26 L50,26 Z M50,82 L58,82 L58,98 L50,98 Z M10,50 L26,50 L26,58 L10,58 Z M82,50 L98,50 L98,58 L82,58 Z"/>
          </vector>
          EOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LevelUp-Pro-App
          path: 'build/app/outputs/**/*.apk'
